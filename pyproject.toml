[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hc-data-skills"
version = "0.1.1"
description = "Team-tier (private, licensed) pack of agent skills for healthcare data engineering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "hc-data-skills contributors" }]
keywords = ["healthcare", "data-engineering", "edi", "fhir", "hl7", "hipaa", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "thefuzz[speedup]>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
hcskills = "hcskills.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/hcskills"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
